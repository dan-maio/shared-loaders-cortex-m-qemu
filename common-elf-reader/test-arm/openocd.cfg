# openocd.cfg — WeAct STM32F411CE BlackPill (CMSIS-DAP) with semihosting.
#
# The firmware reads its ELF filename from the semihosting command line.
# Pass it via:  arm semihosting_cmdline elf-reader-test-arm <path-to-elf>

source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0x1a86 0x8011
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 2000

init
