# openocd-nucleo.cfg -- OpenOCD flash config for the NUCLEO-F411RE board.
#
# NUCLEO-F411RE = ST-LINK/V2.1 on-board probe (VID:PID 0483:374b) + STM32F411RE
# (Cortex-M4F). The on-board ST-LINK is used directly, no external probe.
#
# connect_assert_srst: assert nRST while connecting so we can recover a core that
# locked up (double fault, empty flash) on a previous run.
source [find board/st_nucleo_f4.cfg]
reset_config connect_assert_srst
# Distinct ports so weact + nucleo OpenOCD can run concurrently.
gdb port 3334
telnet port 4446
tcl port 6668
