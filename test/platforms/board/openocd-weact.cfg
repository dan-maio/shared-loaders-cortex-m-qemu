# openocd-weact.cfg -- OpenOCD flash config for the WEACT-F411CE (BlackPill).
#
# WEACT-F411CE = CMSIS-DAP on-board probe (VID:PID 1a86:8011, CH32V305 variant)
# + STM32F411CE (Cortex-M4F). Probe interface is SWD.
source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0x1a86 0x8011
# WCH-Link exposes 3 USB interfaces; CMSIS-DAP is on the HID interface (2).
# Without explicit selection the probe can pick the wrong interface and
# corrupt the command channel ("CMSIS-DAP command mismatch").
cmsis-dap usb interface 2
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 2000
gdb port 0
# Distinct ports so weact + nucleo OpenOCD can run concurrently.
telnet port 4445
tcl port 6667
